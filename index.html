<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio · Jacob Berggren</title>
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        document.documentElement.dataset.theme = t
      })()
    </script>
    <link rel="stylesheet" href="/styles.css" />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=Rubik:wght@300;400&family=Dancing+Script:wght@400&display=swap" rel="stylesheet" />
    <style>
      #loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#060606;transition:opacity .45s ease,visibility .45s}
      :root[data-theme="light"] #loader{background:#e9e8e6}
      #loader.is-done{opacity:0;visibility:hidden;pointer-events:none}
      /* Spinner in the navbar colours. It only fades in if loading drags on (1s delay), so fast loads never show it.
         The ring turns with an eased "ååå-hejjj" on every lap and has a long, soft tail. */
      #loader span{display:block;opacity:0;animation:loader-appear .5s ease 1s forwards}
      #loader span b{display:block;width:56px;height:56px;border-radius:50%;
        background:conic-gradient(from 0deg,rgba(115,131,175,0) 0%,rgba(115,131,175,.08) 16%,rgba(124,140,190,.35) 38%,#7d8ab3 56%,#9faac8 72%,#bcc5d6 88%,rgba(188,197,214,0) 100%);
        -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 2.5px));
        mask:radial-gradient(farthest-side,transparent calc(100% - 3.5px),#000 calc(100% - 2.5px));
        animation:loader-spin 1.5s cubic-bezier(.76,0,.24,1) infinite}
      @keyframes loader-appear{to{opacity:1}}
      @keyframes loader-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#loader span b{animation-duration:3s}}
    </style>
  </head>
  <body>
    <div id="loader" aria-hidden="true"><span><b></b></span></div>
    <div id="root"></div>
    <script>
      (function () {
        var loader = document.getElementById('loader')
        var start = Date.now()
        var done = false

        function hide() {
          if (done) return
          done = true
          var wait = Math.max(0, 350 - (Date.now() - start))
          setTimeout(function () {
            loader.classList.add('is-done')
            setTimeout(function () { loader.remove() }, 600)
          }, wait)
        }

        var loaded = new Promise(function (r) {
          if (document.readyState === 'complete') r()
          else window.addEventListener('load', r)
        })
        var fonts = document.fonts ? document.fonts.ready : Promise.resolve()
        Promise.all([loaded, fonts]).then(function () { requestAnimationFrame(hide) })
        setTimeout(hide, 8000)
      })()
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
